<body>
  <h1>SPC700 Assembler (HTML/JS)</h1>

  <div class="row">
    <div>
      <h3>Source</h3>
      <textarea id="source">; SPC700 sample
org $0200

start:
  mov a,#$00
  mov x,#$ef
  mov sp,x

  mov a,#$aa
  mov $f4,a          ; port0

loop:
  mov a,$f4
  cmp a,#$aa
  bne loop

  bra start

  db $01,$02,$03
  dw $1234
</textarea>
    </div>
    <div>
      <h3>Output</h3>
      <pre id="output"></pre>
    </div>
  </div>

  <button onclick="assemble()">Assemble</button>
  <button onclick="downloadBin()">Download .bin</button>
  <button onclick="clearOutput()">Clear</button>

<script>
// ============================================================
// SPC700 Instruction Table (Sony syntax)
// ============================================================
const opcodes = {
  // Implied / Register
  "NOP":          {op:0x00, len:1},
  "CLRP":         {op:0x20, len:1},

  // MOV register <-> register

  // MOV immediate

  "SBC A,#imm":   {op:0xA8, len:2},
  "SBC A,dp":     {op:0xA4, len:2},
  "SBC A,dp+X":   {op:0xB4, len:2},

  "SBC dp,#imm":  {op:0xB8, len:3},

  "CMP A,dp":     {op:0x64, len:2},
  "CMP A,dp+X":   {op:0x74, len:2},
  "CMP A,!abs":   {op:0x65, len:3},
  "CMP A,!abs+X": {op:0x75, len:3},
  "CMP A,!abs+Y": {op:0x76, len:3},
  "CMP A,(X)":    {op:0x66, len:1},
  "CMP A,[dp+X]": {op:0x67, len:2},
  "CMP A,[dp]+Y": {op:0x77, len:2},
  "CMP (X),(Y)":  {op:0x79, len:1},
  "CMP X,#imm":   {op:0xC8, len:2},
  "CMP X,dp":     {op:0x3E, len:2},
  "CMP X,!abs":   {op:0x1E, len:3},
  "CMP Y,#imm":   {op:0xAD, len:2},
  "CMP Y,dp":     {op:0x7E, len:2},
  "CMP Y,!abs":   {op:0x5E, len:3},
  "CMP dp,#imm":  {op:0x78, len:3},
  "CMP dp,dp":    {op:0x69, len:3},

  // AND / OR / EOR
  "AND A,#imm":   {op:0x28, len:2},
  "AND A,dp":     {op:0x24, len:2},
  "AND A,dp+X":   {op:0x34, len:2},
  "AND A,!abs":   {op:0x25, len:3},
  "AND A,!abs+X": {op:0x35, len:3},
  "AND A,!abs+Y": {op:0x36, len:3},
  "AND A,(X)":    {op:0x26, len:1},
  "AND A,[dp+X]": {op:0x27, len:2},
  "AND A,[dp]+Y": {op:0x37, len:2},
  "AND (X),(Y)":  {op:0x39, len:1},
  "AND dp,#imm":  {op:0x38, len:3},
  "AND dp,dp":    {op:0x29, len:3},

  "OR A,#imm":    {op:0x08, len:2},
  "OR A,dp":      {op:0x04, len:2},
  "OR A,dp+X":    {op:0x14, len:2},
  "OR A,!abs":    {op:0x05, len:3},
  "OR A,!abs+X":  {op:0x15, len:3},
  "OR A,!abs+Y":  {op:0x16, len:3},
  "OR A,(X)":     {op:0x06, len:1},
  "OR A,[dp+X]":  {op:0x07, len:2},
  "OR A,[dp]+Y":  {op:0x17, len:2},
  "OR (X),(Y)":   {op:0x19, len:1},
  "OR dp,#imm":   {op:0x18, len:3},
  "OR dp,dp":     {op:0x09, len:3},

  "EOR A,#imm":   {op:0x48, len:2},
  "EOR A,dp":     {op:0x44, len:2},
  "EOR A,dp+X":   {op:0x54, len:2},
  "EOR A,!abs":   {op:0x45, len:3},
  "EOR A,!abs+X": {op:0x55, len:3},
  "EOR A,!abs+Y": {op:0x56, len:3},
  "EOR A,(X)":    {op:0x46, len:1},
  "EOR A,[dp+X]": {op:0x47, len:2},
  "EOR A,[dp]+Y": {op:0x57, len:2},
  "EOR (X),(Y)":  {op:0x59, len:1},
  "EOR dp,#imm":  {op:0x58, len:3},
  "EOR dp,dp":    {op:0x49, len:3},

  // INC / DEC
  "INC A":        {op:0xBC, len:1},
  "INC X":        {op:0x3D, len:1},
  "INC Y":        {op:0xFC, len:1},
  "INC dp":       {op:0xAB, len:2},
  "INC dp+X":     {op:0xBB, len:2},
  "INC !abs":     {op:0xAC, len:3},
  "DEC A":        {op:0x9C, len:1},
  "DEC X":        {op:0x1D, len:1},
  "DEC Y":        {op:0xDC, len:1},
  "DEC dp":       {op:0x8B, len:2},
  "DEC dp+X":     {op:0x9B, len:2},
  "DEC !abs":     {op:0x8C, len:3},

  // ASL / LSR / ROL / ROR
  "ASL A":        {op:0x1C, len:1},
  "ASL dp":       {op:0x0B, len:2},
  "ASL dp+X":     {op:0x1B, len:2},
  "ASL !abs":     {op:0x0C, len:3},
  "LSR A":        {op:0x5C, len:1},
  "LSR dp":       {op:0x4B, len:2},
  "LSR dp+X":     {op:0x5B, len:2},
  "LSR !abs":     {op:0x4C, len:3},
  "ROL A":        {op:0x3C, len:1},
  "ROL dp":       {op:0x2B, len:2},
  "ROL dp+X":     {op:0x3B, len:2},
  "ROL !abs":     {op:0x2C, len:3},
  "ROR A":        {op:0x7C, len:1},
  "ROR dp":       {op:0x6B, len:2},
  "ROR dp+X":     {op:0x7B, len:2},
  "ROR !abs":     {op:0x6C, len:3},

  // Word ops
  "MOVW YA,dp":   {op:0xBA, len:2},
  "MOVW dp,YA":   {op:0xDA, len:2},
  "INCW dp":      {op:0x3A, len:2},
  "DECW dp":      {op:0x1A, len:2},
  "ADDW YA,dp":   {op:0x7A, len:2},
  "SUBW YA,dp":   {op:0x9A, len:2},
  "CMPW YA,dp":   {op:0x5A, len:2},

  // Branches (relative)
  "BRA rel":      {op:0x2F, len:2},
  "BEQ rel":      {op:0xF0, len:2},
  "BNE rel":      {op:0xD0, len:2},
  "BCS rel":      {op:0xB0, len:2},
  "BCC rel":      {op:0x90, len:2},
  "BVS rel":      {op:0x70, len:2},
  "BVC rel":      {op:0x50, len:2},
  "BMI rel":      {op:0x30, len:2},
  "BPL rel":      {op:0x10, len:2},

  // CALL / JMP
  "CALL !abs":    {op:0x3F, len:3},
  "JMP !abs":     {op:0x5F, len:3},
  "JMP [!abs+X]": {op:0x1F, len:3},
  "PCALL upage":  {op:0x4F, len:2},

  // Bit ops (handled specially)
  "SET1 dp.bit":  {op:0x02, len:2},
  "CLR1 dp.bit":  {op:0x12, len:2},
  "BBS dp.bit,rel":{op:0x03, len:3},
  "BBC dp.bit,rel":{op:0x13, len:3},
  "CBNE dp,rel":  {op:0x2E, len:3},
  "CBNE dp+X,rel":{op:0xDE, len:3},
  "DBNZ dp,rel":  {op:0x6E, len:3},
  "DBNZ Y,rel":   {op:0xFE, len:2},
};

// ============================================================
// Assembler
// ============================================================
let binary = [];
let labels = {};
let errors = [];
let currentAddr = 0x0200;

function parseNumber(str) {
  str = String(str).trim().toLowerCase();
  if (str.startsWith("#$")) return parseInt(str.slice(2), 16);
  if (str.startsWith("#"))  return parseInt(str.slice(1), 10);
  if (str.startsWith("$"))  return parseInt(str.slice(1), 16);
  if (str.startsWith("0x")) return parseInt(str.slice(2), 16);
  if (str.startsWith("%"))  return parseInt(str.slice(1), 2);
  return parseInt(str, 10);
}

function isNumber(str) {
  str = String(str).trim().toLowerCase();
  return /^#?\$?[0-9a-f]+$/.test(str) ||
         /^0x[0-9a-f]+$/.test(str) ||
         /^%[01]+$/.test(str) ||
         /^#?[0-9]+$/.test(str);
}

function resolveOperand(op, pass) {
  op = String(op).trim();
  // strip leading ! for absolute
  if (op.startsWith("!")) op = op.slice(1);

  if (isNumber(op)) {
    return parseNumber(op);
  }

  // labels are always stored in UPPERCASE
  const key = op.toUpperCase();
  if (labels[key] !== undefined) return labels[key];

  if (pass === 2) errors.push(`Undefined label: ${op}`);
  return 0;
}

function assembleLine(line, pass) {
  line = line.replace(/;.*$/, "").trim();
  if (!line) return;

  // Label definition
  if (line.endsWith(":")) {
    const name = line.slice(0, -1).trim().toUpperCase();
    if (pass === 1) {
      if (labels[name] !== undefined) {
        errors.push(`Duplicate label: ${name}`);
      }
      labels[name] = currentAddr;
    }
    return;
  }

  const parts = line.split(/\s+/);
  const dir = parts[0].toLowerCase();

  // Directives
  if (dir === "org") {
    currentAddr = parseNumber(parts[1]);
    return;
  }
  if (dir === "db" || dir === ".db") {
    for (let i = 1; i < parts.length; i++) {
      const tok = parts[i].replace(/,$/, "");
      const v = resolveOperand(tok, pass) & 0xFF;
      if (pass === 2) binary.push(v);
      currentAddr++;
    }
    return;
  }
  if (dir === "dw" || dir === ".dw") {
    for (let i = 1; i < parts.length; i++) {
      const tok = parts[i].replace(/,$/, "");
      const v = resolveOperand(tok, pass) & 0xFFFF;
      if (pass === 2) {
        binary.push(v & 0xFF);
        binary.push((v >> 8) & 0xFF);
      }
      currentAddr += 2;
    }
    return;
  }

  // Instruction
  let mnemonic = parts[0].toUpperCase();
  let operands = parts.slice(1).join(" ").toUpperCase().replace(/\s+/g, "");

  // TCALL n
  if (mnemonic === "TCALL") {
    const n = parseNumber(operands) & 0x0F;
    if (pass === 2) binary.push(0x01 + n * 0x10);
    currentAddr += 1;
    return;
  }

  // SET1 / CLR1 / BBS / BBC  (dp.bit form)
  if (["SET1","CLR1","BBS","BBC"].includes(mnemonic)) {
    const m = operands.match(/^(\$?[0-9A-F]+|[A-Z_][A-Z0-9_]*)\.([0-7])(?:,(.+))?$/i);
    if (!m) {
      errors.push(`Invalid bit syntax: ${line}`);
      return;
    }
    const dp = resolveOperand(m[1], pass) & 0xFF;
    const bit = parseInt(m[2], 10);
    const base = {SET1:0x02, CLR1:0x12, BBS:0x03, BBC:0x13}[mnemonic];
    const op = base + bit * 0x20;

    if (pass === 2) binary.push(op);
    currentAddr++;
    if (pass === 2) binary.push(dp);
    currentAddr++;

    if (mnemonic === "BBS" || mnemonic === "BBC") {
      const target = resolveOperand(m[3], pass);
      const rel = (target - (currentAddr + 1)) & 0xFF;
      if (pass === 2) binary.push(rel);
      currentAddr++;
    }
    return;
  }

  // Normal instructions
  let matched = false;
  const candidates = Object.keys(opcodes).filter(k =>
    k === mnemonic || k.startsWith(mnemonic + " ")
  );

  for (const key of candidates) {
    const def = opcodes[key];
    const pattern = key.slice(mnemonic.length).trim(); // e.g. "A,#imm"

    // implied
    if (!pattern) {
      if (!operands) {
        if (pass === 2) binary.push(def.op);
        currentAddr += def.len;
        matched = true;
        break;
      }
      continue;
    }

    // build regex
    let regexStr = pattern
      .replace(/\+/g, "\\+")
      .replace(/\[/g, "\\[")
      .replace(/\]/g, "\\]")
      .replace(/!abs/g, "(!?[\\$0-9A-Fa-f]+|[A-Za-z_][A-Za-z0-9_]*)")
      .replace(/dp/g, "([\\$0-9A-Fa-f]+|[A-Za-z_][A-Za-z0-9_]*)")
      .replace(/#imm/g, "(#?[\\$0-9A-Fa-f]+)")
      .replace(/rel/g, "([A-Za-z_][A-Za-z0-9_]*|[\\$0-9A-Fa-f]+)")
      .replace(/upage/g, "([\\$0-9A-Fa-f]+)");

    const re = new RegExp("^" + regexStr + "$", "i");
    const m = operands.match(re);
    if (!m) continue;

    // emit opcode
    if (pass === 2) binary.push(def.op);
    currentAddr++;

    // emit operands
    if (pattern.includes("#imm")) {
      const val = resolveOperand(m[1], pass) & 0xFF;
      if (pass === 2) binary.push(val);
      currentAddr++;
    }
    else if (pattern.includes("!abs")) {
      let addr = resolveOperand(m[1], pass) & 0xFFFF;
      if (pass === 2) {
        binary.push(addr & 0xFF);
        binary.push((addr >> 8) & 0xFF);
      }
      currentAddr += 2;
    }
    else if (pattern.includes("dp") && !pattern.includes("rel")) {
      // first dp
      const val = resolveOperand(m[1], pass) & 0xFF;
      if (pass === 2) binary.push(val);
      currentAddr++;

      // second operand (dp or #imm)
      if (pattern.includes(",dp") || pattern.includes(",#imm")) {
        const val2 = resolveOperand(m[2], pass) & 0xFF;
        if (pass === 2) binary.push(val2);
        currentAddr++;
      }
    }
    else if (pattern.includes("rel")) {
      const target = resolveOperand(m[1], pass);
      const nextPC = currentAddr + 1;
      let rel = (target - nextPC) & 0xFF;
      if (pass === 2) {
        const signed = rel > 127 ? rel - 256 : rel;
        if (signed < -128 || signed > 127) {
          errors.push(`Branch out of range: ${line}`);
        }
        binary.push(rel);
      }
      currentAddr++;
    }
    else if (pattern.includes("upage")) {
      const val = resolveOperand(m[1], pass) & 0xFF;
      if (pass === 2) binary.push(val);
      currentAddr++;
    }

    matched = true;
    break;
  }

  if (!matched) {
    errors.push(`Unknown instruction: ${line}`);
  }
}

function assemble() {
  const src = document.getElementById("source").value;
  const lines = src.split("\n");
  errors = [];
  labels = {};
  binary = [];
  currentAddr = 0x0200;

  // ---------- Pass 1: labels & size ----------
  for (let raw of lines) {
    let line = raw.replace(/;.*$/, "").trim();
    if (!line) continue;

    // equ / =
    if (/=/.test(line) || line.toLowerCase().startsWith("equ")) {
      const m = line.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*(?:=\s*|equ\s+)(.+)$/i);
      if (m) {
        labels[m[1].toUpperCase()] = parseNumber(m[2]);
      }
      continue;
    }

    assembleLine(line, 1);
  }

  // ---------- Pass 2: generate code ----------
  binary = [];
  currentAddr = 0x0200;
  for (let raw of lines) {
    let line = raw.replace(/;.*$/, "").trim();
    if (!line) continue;
    if (/=/.test(line) || line.toLowerCase().startsWith("equ")) continue;
    assembleLine(line, 2);
  }

  // ---------- Output ----------
  let out = "";
  if (errors.length) {
    out += "<span class='error'>Errors:\n" + errors.join("\n") + "</span>\n\n";
  }

  out += `<span class='info'>Labels:</span>\n`;
  const sorted = Object.keys(labels).sort();
  for (const k of sorted) {
    out += `  ${k.padEnd(12)} = $${labels[k].toString(16).toUpperCase().padStart(4,"0")}\n`;
  }

  out += `\n<span class='info'>Binary (${binary.length} bytes) starting at $0200:</span>\n`;
  for (let i = 0; i < binary.length; i += 16) {
    const addr = (0x0200 + i).toString(16).toUpperCase().padStart(4, "0");
    const hex = binary.slice(i, i + 16)
      .map(b => b.toString(16).toUpperCase().padStart(2, "0"))
      .join(" ");
    out += `${addr}: ${hex}\n`;
  }

  document.getElementById("output").innerHTML = out;
}

function downloadBin() {
  if (!binary.length) {
    alert("Assemble first");
    return;
  }
  const blob = new Blob([new Uint8Array(binary)], { type: "application/octet-stream" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "spc700.bin";
  a.click();
}

function clearOutput() {
  document.getElementById("output").textContent = "";
}

window.onload = assemble;
</script>
</body>
